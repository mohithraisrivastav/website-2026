<!DOCTYPE html>
<!-- ============================================================
     ar-xr.html — CUSTOM WEBXR AR (Phase 1 proof-of-concept)

     Standalone WebXR Immersive AR experience for a single framed
     print (Cosmic Return). Replaces model-viewer entirely with
     direct Three.js + WebXR API access.

     What this delivers vs. model-viewer:
       - Persistent UI during the ENTIRE AR session (HUD, chips,
         close button) — model-viewer's ar-prompt slot hides on
         placement, this doesn't
       - Vertical-plane (wall) hit-test with normal filtering
       - XRAnchor-based placement (print stays put as you walk
         around the room, no drift)
       - Post-placement hang-height adjustment (chips slide the
         print up/down the wall in real time)
       - Architect-grade real-world scale from the existing GLB

     iOS path: untouched. iOS uses Quick Look in shop.html.
     This file is Android Chrome only.

     URL: /ar-xr.html  (Phase 2 will accept ?id=<product> param)
     ============================================================ -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<title>AR — Cosmic Return — GOAF Fine Art</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; }
  body {
    background: #14110d; color: #f7f3ec;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  /* During AR session, body background must NOT be visible — the
     camera feed renders under the Three.js canvas. */
  body.xr-active { background: transparent; }

  /* WebXR canvas: full-viewport, behind the overlay. */
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100% !important;
    height: 100% !important;
    z-index: 1;
  }

  /* ── PRE-AR LAUNCH SCREEN ───────────────────────────────────
     Shown until the user taps "Enter AR" — required because
     WebXR session start needs a user gesture. */
  #launchScreen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px;
    background: radial-gradient(circle at 50% 30%,
                rgba(207,162,70,0.08) 0%, transparent 60%), #14110d;
    z-index: 100;
  }
  #launchScreen h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-weight: 300;
    font-size: 2.4rem; letter-spacing: 0.5px;
    color: #f7f3ec; margin-bottom: 8px;
  }
  #launchScreen .dims {
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: #CFA246; margin-bottom: 56px;
  }
  #startBtn {
    background: #CFA246; color: #14110d;
    border: none; padding: 18px 42px;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem; font-weight: 800;
    letter-spacing: 4px; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 14px 40px rgba(207,162,70,0.3);
    transition: background 0.2s, transform 0.2s;
  }
  #startBtn:active { transform: scale(0.97); }
  #startBtn:disabled { opacity: 0.4; cursor: default; }
  #errorMsg {
    margin-top: 32px; max-width: 320px; text-align: center;
    font-size: 0.82rem; line-height: 1.7;
    color: rgba(247,243,236,0.6);
  }
  #errorMsg.show { color: #e88c8c; }

  /* ── WEBXR DOM OVERLAY ─────────────────────────────────────
     Renders OVER the AR camera feed during the session. Persists
     for the lifetime of the session — no hiding on placement.
     Element passed to WebXR via session options.domOverlay.root.

     CRITICAL: must be display:block (not display:none) at the
     moment requestSession() is called — the dom-overlay feature
     requires the root element to be VISIBLE in the document when
     the session starts. We hide via opacity/visibility instead. */
  #overlay {
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: 0; visibility: hidden;
    transition: opacity 0.3s ease;
    z-index: 50;
  }
  #overlay.active { opacity: 1; visibility: visible; }
  #overlay button { pointer-events: auto; }

  /* Measurement HUD (top) */
  #hud {
    position: absolute;
    top: max(56px, env(safe-area-inset-top, 56px));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10,10,10,0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(247,243,236,0.18);
    border-radius: 26px;
    padding: 11px 24px;
    text-align: center;
    white-space: nowrap;
  }
  #hudTitle {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-weight: 300;
    font-size: 1rem; line-height: 1.15;
    color: rgba(247,243,236,0.95);
    margin-bottom: 4px;
  }
  #hudDims {
    font-family: 'Inter', sans-serif;
    font-size: 0.62rem; font-weight: 700;
    letter-spacing: 2.5px; text-transform: uppercase;
    color: #CFA246;
  }

  /* Wall-finding prompt + status (bottom-centre) */
  #statusPill {
    position: absolute;
    bottom: max(120px, env(safe-area-inset-bottom, 0px) + 120px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10,10,10,0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(247,243,236,0.18);
    border-radius: 24px;
    padding: 11px 22px;
    display: flex; align-items: center; gap: 10px;
    white-space: nowrap;
    transition: opacity 0.3s ease;
  }
  #statusPill svg { flex-shrink: 0; }
  #statusText {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem; font-weight: 400;
    color: rgba(247,243,236,0.92);
  }
  #statusPill.placed { opacity: 0; pointer-events: none; }
  #overlay.placed #statusPill { opacity: 0; pointer-events: none; }

  #frontWallBtn {
    position: absolute;
    bottom: max(72px, env(safe-area-inset-bottom, 0px) + 72px);
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
    background: rgba(10,10,10,0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(207,162,70,0.48);
    color: #CFA246;
    font-family: 'Inter', sans-serif;
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 2.6px;
    text-transform: uppercase;
    padding: 11px 18px;
    border-radius: 24px;
    cursor: pointer;
  }
  #frontWallBtn.active {
    background: rgba(207,162,70,0.26);
    border-color: rgba(207,162,70,0.82);
  }
  #overlay.placed #frontWallBtn { display: none; }

  /* Chip rows (size + hang-height) and labels — stacked above the
     bottom status pill. Layout from bottom to top:
        120px  status pill
        180px  hang-height chips
        225px  HANG HEIGHT label
        265px  size chips
        310px  SIZE label                                              */
  #chipRow, #sizeRow {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 8px;
    white-space: nowrap;
    pointer-events: none;
  }
  #chipRow { bottom: max(180px, env(safe-area-inset-bottom, 0px) + 180px); }
  #sizeRow { bottom: max(265px, env(safe-area-inset-bottom, 0px) + 265px); }
  .chip {
    pointer-events: auto;
    background: rgba(10,10,10,0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(247,243,236,0.2);
    color: rgba(247,243,236,0.78);
    font-family: 'Inter', sans-serif;
    font-size: 0.66rem; font-weight: 700;
    letter-spacing: 1.5px;
    padding: 9px 16px; border-radius: 40px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .chip.active {
    background: rgba(207,162,70,0.3);
    border-color: rgba(207,162,70,0.7);
    color: #CFA246;
  }
  .chip[disabled] { opacity: 0.4; pointer-events: none; }
  .chip-label {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 0.56rem; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: rgba(247,243,236,0.4);
    white-space: nowrap;
  }
  .chip-label.hang { bottom: max(225px, env(safe-area-inset-bottom, 0px) + 225px); }
  .chip-label.size { bottom: max(310px, env(safe-area-inset-bottom, 0px) + 310px); }

  #movePanel {
    position: absolute;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom, 0px) + 22px);
    transform: translateX(-50%);
    display: none;
    grid-template-columns: repeat(3, 44px);
    gap: 8px;
    padding: 10px;
    background: rgba(10,10,10,0.62);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(247,243,236,0.16);
    border-radius: 20px;
    pointer-events: auto;
  }
  #overlay.placed #movePanel { display: grid; }
  .adjust-btn {
    width: 44px;
    height: 38px;
    border: 1px solid rgba(247,243,236,0.18);
    border-radius: 14px;
    background: rgba(20,17,13,0.74);
    color: rgba(247,243,236,0.88);
    font-family: 'Inter', sans-serif;
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0;
    cursor: pointer;
  }
  .adjust-btn:active {
    background: rgba(207,162,70,0.32);
    border-color: rgba(207,162,70,0.75);
    color: #CFA246;
  }

  /* Debug pill — top-left, shows live hit-test info during dev */
  #debugPill {
    position: absolute;
    top: max(20px, env(safe-area-inset-top, 20px));
    left: 20px;
    background: rgba(10,10,10,0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(247,243,236,0.18);
    border-radius: 14px;
    padding: 8px 12px;
    font-family: ui-monospace, monospace;
    font-size: 0.62rem;
    color: rgba(247,243,236,0.85);
    line-height: 1.45;
    white-space: pre;
    pointer-events: none;
    z-index: 60;
  }

  /* TAP hint (only visible when reticle locks; placement only) */
  #tapHint {
    position: absolute;
    top: calc(50% + 36px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 0.66rem; font-weight: 800;
    letter-spacing: 5px; text-transform: uppercase;
    color: #CFA246;
    text-shadow: 0 1px 8px rgba(20,17,13,0.9),
                 0 0 16px rgba(20,17,13,0.7);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #overlay.tracking-good:not(.placed) #tapHint { opacity: 1; }

  /* Close button (top-right) */
  #closeBtn {
    position: absolute;
    top: max(20px, env(safe-area-inset-top, 20px));
    right: 20px;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(10,10,10,0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #f7f3ec;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  #closeBtn:active { background: rgba(207,162,70,0.4); }

  /* Edge vignette (search feedback — fades when tracking solid) */
  #edgeScan {
    position: absolute; inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 140px 30px rgba(207,162,70,0.22);
    animation: edge-pulse 2.6s ease-in-out infinite;
    transition: opacity 0.5s ease;
  }
  #overlay.tracking-good #edgeScan,
  #overlay.placed #edgeScan { opacity: 0; }
  @keyframes edge-pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.95; }
  }

  /* (Old centered init pulse hint removed — was conflicting with the
     bottom status pill. Status messaging now lives in one place.) */

  /* Loading state for the GLB */
  #loadingPill {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(247,243,236,0.18);
    border-radius: 24px;
    padding: 14px 24px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: rgba(247,243,236,0.85);
    z-index: 200;
    display: none;
  }
  #loadingPill.show { display: block; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<!-- Pre-AR launch screen — required user gesture for WebXR session start -->
<div id="launchScreen">
  <h1>Cosmic Return</h1>
  <div class="dims">42" × 31.5" · 107 × 80 cm</div>
  <button id="startBtn" disabled>Loading…</button>
  <div id="errorMsg"></div>
</div>

<!-- WebXR DOM overlay — visible throughout the AR session -->
<div id="overlay">

  <!-- Edge vignette: pulses while searching, fades when locked -->
  <div id="edgeScan"></div>

  <!-- (Old centered "Move device" pulse removed — was contradicting
       the bottom status pill. Status messaging now consolidated into
       the single pill below.) -->

  <!-- Measurement HUD -->
  <div id="hud">
    <div id="hudTitle">Cosmic Return</div>
    <div id="hudDims">42" × 31.5" · 107 × 80 cm</div>
  </div>

  <!-- Close button -->
  <button id="closeBtn" aria-label="Exit AR">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <button id="frontWallBtn" type="button">Use front wall</button>

  <!-- Size label + chips (Small / Medium / Large) -->
  <div class="chip-label size">Size — print dimensions</div>
  <div id="sizeRow">
    <button class="chip" data-size="small">Small</button>
    <button class="chip" data-size="medium">Medium</button>
    <button class="chip active" data-size="large">Large</button>
  </div>

  <!-- Hang-height label + chips -->
  <div class="chip-label hang">Hang height — gallery standard</div>
  <div id="chipRow">
    <button class="chip active" data-h="57">57"</button>
    <button class="chip" data-h="60">60"</button>
    <button class="chip" data-h="63">63"</button>
  </div>

  <!-- Status pill (wall-finding / placed feedback) -->
  <div id="statusPill">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f7f3ec" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12H6M18 12H22M12 2V6M12 18V22"/>
      <rect x="7" y="7" width="10" height="10" rx="1"/>
    </svg>
    <span id="statusText">Slowly point your camera at a wall</span>
  </div>

  <!-- TAP hint (only when reticle locked + not yet placed) -->
  <div id="tapHint">Tap to place</div>

  <div id="movePanel" aria-label="Adjust placed print">
    <button class="adjust-btn" data-adjust="rot-" type="button" title="Rotate counterclockwise">R-</button>
    <button class="adjust-btn" data-adjust="y+" type="button" title="Move up">Y+</button>
    <button class="adjust-btn" data-adjust="rot+" type="button" title="Rotate clockwise">R+</button>
    <button class="adjust-btn" data-adjust="x-" type="button" title="Move left">X-</button>
    <button class="adjust-btn" data-adjust="reset" type="button" title="Reset position">0</button>
    <button class="adjust-btn" data-adjust="x+" type="button" title="Move right">X+</button>
    <button class="adjust-btn" data-adjust="z-" type="button" title="Move toward wall">Z-</button>
    <button class="adjust-btn" data-adjust="y-" type="button" title="Move down">Y-</button>
    <button class="adjust-btn" data-adjust="z+" type="button" title="Move away from wall">Z+</button>
  </div>

  <!-- Loading pill while the GLB downloads after session start -->
  <div id="loadingPill">Preparing the print…</div>

  <!-- Diagnostic: real-time hit-test info so we can see what ARCore
       is actually returning on the user's device. Remove once the
       wall path is confirmed working. -->
  <div id="debugPill">init</div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ──────────────────────────────────────────────────────────────
   Phase 1 hardcoded to Cosmic Return + its three GLB sizes.
   Phase 2 will read ?id=<> from the URL and use a catalogue map. */
const PRODUCT_TITLE = 'Cosmic Return';
const SIZES = [
    { id: 'small',  label: 'Small',  wIn: 18, hIn: 13.5, glb: 'ar/cosmic-return-small.glb'  },
    { id: 'medium', label: 'Medium', wIn: 24, hIn: 18,   glb: 'ar/cosmic-return-medium.glb' },
    { id: 'large',  label: 'Large',  wIn: 42, hIn: 31.5, glb: 'ar/cosmic-return.glb'        }
];
/* Default to Large (the catalogue canonical size for this print) */
let currentSize = SIZES[2];

/* GLB cache — avoids re-downloading when the user toggles between
   sizes. Stores the raw gltf.scene, callers clone() before adding. */
const glbCache = new Map();

/* ──── Element handles ──── */
const $ = (id) => document.getElementById(id);
const launchScreen = $('launchScreen');
const startBtn     = $('startBtn');
const errorMsg     = $('errorMsg');
const overlay      = $('overlay');
const statusText   = $('statusText');
const statusPill   = $('statusPill');
const loadingPill  = $('loadingPill');
const closeBtn     = $('closeBtn');
const frontWallBtn = $('frontWallBtn');

/* ──── Three.js state ──── */
let renderer, scene, camera;
let printModel = null;   // GLB scene
let reticle    = null;   // Hit-test visualization (a thin gold ring on the wall)
let tapeGroup  = null;   // Floor-to-centre measurement overlay

/* ──── WebXR state ──── */
let xrSession        = null;
let xrRefSpace       = null;   // local reference space (origin = where session started)
let viewerSpace      = null;   // viewer space (origin = device)
let hitTestSource    = null;
let printAnchor      = null;   // XRAnchor for placed print
let isPlaced         = false;
let sessionStartTime = 0;      // for diagnostic elapsed-time display
let detectedFloorY   = null;   // world/local-space Y for the lowest detected horizontal plane
let floorSeenAt      = 0;

/* ──── Print transform state (post-placement) ────
   All measurements are in WALL-LOCAL space, i.e. relative to the
   placement anchor:
     wallOffsetX  metres along the wall to the right
     wallOffsetY  metres up the wall (chip clicks AND vertical drag)
     wallOffsetZ  metres out from / into the wall
     wallRotZ     radians, rotation around the wall normal
   Updated by hang-height chips, single-finger drag, and two-finger
   twist gestures. Applied each frame in updatePrintFromAnchor. */
const DEFAULT_HANG_HEIGHT_IN = 57;
let hangHeightIn = DEFAULT_HANG_HEIGHT_IN;
let wallOffsetX  = 0;
let wallOffsetY  = 0;
let wallOffsetZ  = 0;
let wallRotZ     = 0;

/* Manual front-wall fallback. ARCore often detects floors and side walls
   before a blank wall viewed straight-on; this mode gives the user a
   camera-facing virtual wall when hit-test never returns that plane. */
let manualWallMode = false;
let manualPlacementReady = false;
let manualWallDistanceM = 1.8;
const MOVE_STEP_M = 0.0254;
const ROT_STEP_RAD = THREE.MathUtils.degToRad(2);
let adjustRepeatTimer = null;
let adjustControlsWired = false;
let frontWallButtonWired = false;
let hangChipsWired = false;
let sizeChipsWired = false;
let closeButtonWired = false;

/* ──── Init: pre-AR support check + load GLB in background ──── */
async function init() {
    // Check WebXR support first so we can show a helpful error
    if (!navigator.xr) {
        showError('WebXR is not available in this browser. Open this page in Chrome on an Android device with ARCore.');
        return;
    }

    let supported = false;
    try {
        supported = await navigator.xr.isSessionSupported('immersive-ar');
    } catch (e) {
        showError('Could not check AR support: ' + e.message);
        return;
    }
    if (!supported) {
        showError('Immersive AR is not supported on this device. ARCore + Chrome required.');
        return;
    }

    /* Preload the default (Large) GLB so session start doesn't block.
       Other sizes load lazily when the user taps a size chip. */
    try {
        printModel = await loadSizedGLB(currentSize);
        printModel.visible = false;
    } catch (e) {
        showError('Could not load the print model: ' + e.message);
        return;
    }

    /* Wire start button */
    startBtn.disabled = false;
    startBtn.textContent = 'Enter AR';
    startBtn.addEventListener('click', startXR);

    /* HUD initial state */
    refreshHud();
}

/* Load (or fetch from cache) the GLB for a given size. Returns a
   fresh THREE.Object3D each call so the same scene-graph never gets
   attached to two scenes at once. */
async function loadSizedGLB(size) {
    let template = glbCache.get(size.glb);
    if (!template) {
        const loader = new GLTFLoader();
        const gltf = await loader.loadAsync(size.glb);
        template = gltf.scene;
        template.traverse((obj) => {
            if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = false; }
        });
        glbCache.set(size.glb, template);
    }
    return template.clone(true);
}

/* Push the current product title + currentSize into the HUD pill. */
function refreshHud() {
    const wCm = Math.round(currentSize.wIn * 2.54);
    const hCm = Math.round(currentSize.hIn * 2.54);
    $('hudTitle').textContent = PRODUCT_TITLE;
    $('hudDims').textContent  = currentSize.wIn + '" × ' + currentSize.hIn + '"  ·  ' + wCm + ' × ' + hCm + ' cm';
}

function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    startBtn.disabled = true;
    startBtn.textContent = 'AR Unavailable';
}

/* ──── Three.js renderer setup ──── */
function initThree() {
    renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true,
        powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    /* Critical for WebXR AR: explicit transparent clear so the camera feed
       composites under the canvas. Without this, every frame clears to
       opaque black and the camera passthrough is hidden. */
    renderer.setClearColor(0x000000, 0);
    renderer.xr.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    document.body.appendChild(renderer.domElement);

    scene  = new THREE.Scene();
    camera = new THREE.PerspectiveCamera();

    // Lighting — WebXR light-estimation will dynamically adjust intensity
    // when supported. These are baseline values for devices that don't
    // expose light estimation.
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(0.5, 1, 0.3);
    scene.add(dir);

    // Hit-test reticle — a thin gold ring + center dot drawn on the wall.
    // Always sits flush against whatever vertical plane is hit.
    const reticleGroup = new THREE.Group();
    const ringGeo = new THREE.RingGeometry(0.07, 0.082, 48);
    const ringMat = new THREE.MeshBasicMaterial({
        color: 0xCFA246, side: THREE.DoubleSide,
        transparent: true, opacity: 0.92
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    reticleGroup.add(ring);
    const dotGeo = new THREE.CircleGeometry(0.008, 24);
    const dotMat = new THREE.MeshBasicMaterial({ color: 0xCFA246 });
    const dot = new THREE.Mesh(dotGeo, dotMat);
    reticleGroup.add(dot);

    reticle = reticleGroup;
    reticle.visible = false;
    reticle.matrixAutoUpdate = false;
    scene.add(reticle);

    initTapeMeasure();

    // Add the print to the scene (initially hidden)
    if (printModel) scene.add(printModel);
}

/* ──── Start WebXR session ──── */
async function startXR() {
    initThree();

    /* The overlay element MUST be in the document AND visible (not
       display:none) BEFORE requestSession is called — otherwise Chrome
       silently fails the dom-overlay feature handshake. So we activate
       the overlay first, request the session second. */
    overlay.classList.add('active');
    document.body.classList.add('xr-active');
    launchScreen.style.display = 'none';
    loadingPill.classList.add('show');

    /* hit-test + anchors + dom-overlay are required; plane-detection
       is requested as optional. plane-detection asks ARCore to track
       full XRPlane geometries (not just hit points), which on some
       builds nudges Chrome to enable more aggressive plane scanning
       — useful for hard-to-detect surfaces like featureless walls. */
    const sessionInit = {
        requiredFeatures: ['hit-test', 'anchors', 'dom-overlay'],
        optionalFeatures: ['plane-detection'],
        domOverlay: { root: overlay }
    };

    try {
        xrSession = await navigator.xr.requestSession('immersive-ar', sessionInit);
    } catch (e) {
        showLoadingError('Session start failed: ' + e.message);
        return;
    }

    xrSession.addEventListener('end', onSessionEnd);
    xrSession.addEventListener('select', onSelect);

    /* Three.js's renderer.xr.setSession() internally calls
       requestReferenceSpace with a default type. On most Android Chrome
       devices that default is 'local-floor', which requires the AR
       runtime to estimate the floor — not all devices support it
       (Samsung S24 Ultra refuses it). Force the type to 'local' BEFORE
       setSession so Three.js asks for the always-supported one. */
    renderer.xr.setReferenceSpaceType('local');

    try {
        await renderer.xr.setSession(xrSession);
    } catch (e) {
        showLoadingError('Renderer XR setup failed: ' + e.message);
        return;
    }

    try {
        xrRefSpace  = await xrSession.requestReferenceSpace('local');
        viewerSpace = await xrSession.requestReferenceSpace('viewer');
    } catch (e) {
        showLoadingError('Reference space failed: ' + e.message);
        return;
    }

    try {
        /* Explicit entityTypes: ['plane'] — some Chrome builds default
           to no entity types if omitted, which silently produces zero
           hits. 'plane' is the WebXR-spec name for ARCore's detected
           planes (both horizontal and vertical when available). */
        hitTestSource = await xrSession.requestHitTestSource({
            space: viewerSpace,
            entityTypes: ['plane']
        });
    } catch (e) {
        /* Some browsers don't accept entityTypes; retry without it. */
        try {
            hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });
        } catch (e2) {
            showLoadingError('Hit-test source failed: ' + e2.message);
            return;
        }
    }

    sessionStartTime = performance.now();

    /* Wire UI handlers */
    wireChips();
    wireSizeChips();
    wireAdjustControls();
    wireFrontWallButton();
    if (!closeButtonWired) {
        closeButtonWired = true;
        closeBtn.addEventListener('click', () => { try { xrSession.end(); } catch(e){} });
    }

    /* Start the render loop. Loading pill is removed on the FIRST frame
       that successfully renders (so the user sees the camera as soon as
       it's available, not on an arbitrary timer). */
    renderer.setAnimationLoop(onXRFrame);
}

/* Visible failure surface inside the AR overlay so we never silently
   leave the user staring at a stuck loading state. */
function showLoadingError(msg) {
    loadingPill.classList.add('show');
    loadingPill.style.color = '#e88c8c';
    loadingPill.style.maxWidth = '320px';
    loadingPill.style.fontFamily = 'Inter, sans-serif';
    loadingPill.style.fontStyle = 'normal';
    loadingPill.style.fontSize = '0.78rem';
    loadingPill.style.lineHeight = '1.5';
    loadingPill.style.textAlign = 'center';
    loadingPill.textContent = msg;
    console.error('[AR-XR]', msg);
}

/* ──── Render loop ──── */
let firstFrameRendered = false;

function onXRFrame(time, frame) {
    if (!frame || !xrRefSpace) {
        renderer.render(scene, camera);
        return;
    }

    updateDetectedPlanes(frame);

    if (!isPlaced) {
        if (manualWallMode) {
            updateManualFrontWall(frame);
        } else {
            updateReticle(frame);
        }
    } else {
        updatePrintFromAnchor(frame);
    }

    renderer.render(scene, camera);

    /* First successful frame → camera passthrough is live, hide loading */
    if (!firstFrameRendered) {
        firstFrameRendered = true;
        loadingPill.classList.remove('show');
    }
}

/* ──── Plane-detection wireframes ────
   Requires the optional 'plane-detection' WebXR feature (requested at
   session start). If the runtime didn't grant it, frame.detectedPlanes
   is undefined and we just skip rendering — no error.

   Each XRPlane carries a polygon of points lying in its local X-Z
   plane (y = 0 per spec), with the planeSpace's local Y axis as the
   surface normal. We build a closed LineLoop for each plane, position
   it via the plane's pose, and update only when ARCore marks the
   plane as changed (lastChangedTime) — this keeps GC churn low.

   Wall planes (orientation === 'vertical') render in brand gold so
   the user can SEE which walls ARCore has locked. Floor / ceiling
   render in subtle grey — useful confirmation that detection is
   alive, without competing with the wall outlines visually.

   After placement we fade wireframes to ~25% opacity so they don't
   compete with the placed print, but stay visible enough to confirm
   the print is on a detected surface. */
const planeWireframes = new Map();           // XRPlane → THREE.LineLoop
const planeLastChanged = new WeakMap();      // XRPlane → DOMHighResTimeStamp
const _planePoints = [];

const WALL_LINE_COLOR  = 0xCFA246;
const FLOOR_LINE_COLOR = 0x9c9388;
const WALL_OPACITY_SEARCH = 0.85;
const WALL_OPACITY_PLACED = 0.25;
const FLOOR_OPACITY_SEARCH = 0.32;
const FLOOR_OPACITY_PLACED = 0.10;
const FLOOR_MAX_AGE_MS = 7000;

function buildPlaneGeometry(polygon) {
    /* polygon entries are DOMPointReadOnly { x, y, z, w } with y == 0.
       Build a closed loop by repeating the first vertex at the end. */
    _planePoints.length = 0;
    for (const pt of polygon) {
        _planePoints.push(new THREE.Vector3(pt.x, 0, pt.z));
    }
    if (_planePoints.length > 0) {
        _planePoints.push(_planePoints[0].clone());
    }
    return new THREE.BufferGeometry().setFromPoints(_planePoints);
}

function makePlaneWireframe(plane) {
    const isVertical = plane.orientation === 'vertical';
    const mat = new THREE.LineBasicMaterial({
        color: isVertical ? WALL_LINE_COLOR : FLOOR_LINE_COLOR,
        transparent: true,
        opacity: isVertical ? WALL_OPACITY_SEARCH : FLOOR_OPACITY_SEARCH,
        depthTest: true,
        depthWrite: false
    });
    const line = new THREE.LineLoop(buildPlaneGeometry(plane.polygon), mat);
    line.matrixAutoUpdate = false;
    line.userData.isVertical = isVertical;
    return line;
}

function updateDetectedPlanes(frame) {
    /* Feature may not be granted on this device / runtime */
    if (!frame.detectedPlanes) return;

    const seen = new Set();
    let frameFloorY = Infinity;

    for (const plane of frame.detectedPlanes) {
        seen.add(plane);

        let wireframe = planeWireframes.get(plane);
        if (!wireframe) {
            wireframe = makePlaneWireframe(plane);
            planeWireframes.set(plane, wireframe);
            scene.add(wireframe);
            planeLastChanged.set(plane, plane.lastChangedTime);
        } else if (planeLastChanged.get(plane) !== plane.lastChangedTime) {
            /* Geometry changed — rebuild the polygon outline */
            wireframe.geometry.dispose();
            wireframe.geometry = buildPlaneGeometry(plane.polygon);
            planeLastChanged.set(plane, plane.lastChangedTime);
        }

        const pose = frame.getPose(plane.planeSpace, xrRefSpace);
        if (pose) {
            wireframe.matrix.fromArray(pose.transform.matrix);
            wireframe.visible = true;

            if (plane.orientation === 'horizontal') {
                frameFloorY = Math.min(frameFloorY, pose.transform.position.y);
            }

            /* Fade after placement so wireframes confirm without
               dominating the view */
            const targetOp = wireframe.userData.isVertical
                ? (isPlaced ? WALL_OPACITY_PLACED  : WALL_OPACITY_SEARCH)
                : (isPlaced ? FLOOR_OPACITY_PLACED : FLOOR_OPACITY_SEARCH);
            if (wireframe.material.opacity !== targetOp) {
                wireframe.material.opacity = targetOp;
            }
        } else {
            wireframe.visible = false;
        }
    }

    /* Garbage-collect planes that no longer exist (ARCore can drop a
       plane if it merges or loses tracking) */
    for (const [plane, wireframe] of planeWireframes) {
        if (!seen.has(plane)) {
            scene.remove(wireframe);
            wireframe.geometry.dispose();
            wireframe.material.dispose();
            planeWireframes.delete(plane);
        }
    }

    if (Number.isFinite(frameFloorY)) {
        detectedFloorY = frameFloorY;
        floorSeenAt = performance.now();
    }
}

/* ──── Hit-test → reticle (placement phase) ────
   WebXR hit-test pose convention (per spec):
     local Y axis = surface normal (perpendicular to detected plane)
     local X, Z  = lie ON the surface, oriented arbitrarily
   So for a wall: pose's Y axis is roughly horizontal in world space.
   For a floor:   pose's Y axis is roughly vertical   in world space.
   Wall filter: world-space Y component of the pose's Y axis is small. */
const _surfaceNormal = new THREE.Vector3();
const _quat          = new THREE.Quaternion();
const _hitMatrix     = new THREE.Matrix4();
const _hitPos        = new THREE.Vector3();
const _hitQuat       = new THREE.Quaternion();
const _hitScale      = new THREE.Vector3();
const _worldUp       = new THREE.Vector3(0, 1, 0);
const _wallRight     = new THREE.Vector3();
const _wallUp        = new THREE.Vector3();
const _viewerMatrix  = new THREE.Matrix4();
const _viewerPos     = new THREE.Vector3();
const _viewerQuat    = new THREE.Quaternion();
const _viewerForward = new THREE.Vector3();
const _manualMatrix  = new THREE.Matrix4();

/* Build a placement matrix that puts the GLB upright on the wall:
     - origin at the hit point
     - model's +Z (front face / print) points along the wall normal
       (i.e. into the room, away from the wall)
     - model's +Y (height axis) is the wall's local up — world up
       projected onto the wall surface
     - model's +X (width axis) is the horizontal-along-wall direction
   GLB was authored with print on +Z face, back of frame at z=0, so
   the back face lands flush against the wall and the print faces the
   viewer. */
function buildWallPlacementMatrixFromNormal(srcMatrix, normalWorld, outMatrix) {
    srcMatrix.decompose(_hitPos, _hitQuat, _hitScale);
    const normal = normalWorld.clone().normalize();
    /* Horizontal-along-wall = worldUp × normal */
    _wallRight.crossVectors(_worldUp, normal);
    if (_wallRight.lengthSq() < 1e-6) {
        /* Degenerate: normal is parallel to worldUp (shouldn't happen
           for walls, but guard against NaN). Use world X as fallback. */
        _wallRight.set(1, 0, 0);
    }
    _wallRight.normalize();
    /* Wall up = normal × right  (re-orthogonalises against worldUp) */
    _wallUp.crossVectors(normal, _wallRight).normalize();
    outMatrix.makeBasis(_wallRight, _wallUp, normal);
    outMatrix.setPosition(_hitPos);
    return outMatrix;
}

function updateManualFrontWall(frame) {
    const viewerPose = frame.getViewerPose(xrRefSpace);
    if (!viewerPose) {
        reticle.visible = false;
        manualPlacementReady = false;
        setTrackingState('poor');
        return;
    }

    _viewerMatrix.fromArray(viewerPose.transform.matrix);
    _viewerMatrix.decompose(_viewerPos, _viewerQuat, _hitScale);

    /* Camera looks down local -Z. The virtual wall sits in front of the
       camera; its normal points back toward the user. */
    _viewerForward.set(0, 0, -1).applyQuaternion(_viewerQuat).normalize();
    _hitPos.copy(_viewerPos).addScaledVector(_viewerForward, manualWallDistanceM);
    _surfaceNormal.copy(_viewerForward).multiplyScalar(-1);

    _manualMatrix.identity();
    _manualMatrix.setPosition(_hitPos);
    buildWallPlacementMatrixFromNormal(_manualMatrix, _surfaceNormal, reticle.matrix);
    lastPlacementMatrix.copy(reticle.matrix);
    lastHit = null;
    manualPlacementReady = true;

    reticle.visible = true;
    setTrackingState('good');
    statusText.textContent = 'Front wall mode · tap to place';
    debugPill.textContent =
        'manual wall\n' +
        'distance: ' + manualWallDistanceM.toFixed(2) + 'm\n' +
        'anchor: no';
}

const debugPill = document.getElementById('debugPill');
const _axisY = new THREE.Vector3();
const _axisZ = new THREE.Vector3();

function updateReticle(frame) {
    const results = frame.getHitTestResults(hitTestSource);
    const elapsedS = ((performance.now() - sessionStartTime) / 1000).toFixed(0);

    if (results.length === 0) {
        reticle.visible = false;
        lastHit = null;
        setTrackingState('poor');
        debugPill.textContent = 'hits: 0\nelapsed: ' + elapsedS + 's';
        /* ARCore detects vertical planes via PARALLAX — features on
           the wall must visibly shift between frames. Pointing straight
           at a wall and standing still produces almost no parallax, so
           the wall never gets detected as a plane. The trick is to
           SWEEP the phone in a slow arc PARALLEL to the wall surface,
           or take a step sideways while keeping the wall in frame. */
        if (!isPlaced) {
            statusText.textContent = elapsedS < 6
                ? 'Sweep the phone slowly along the wall'
                : 'Step sideways · or use front wall';
        }
        return;
    }

    /* Inspect the first hit's orientation. WebXR spec says local Y is
       the surface normal but the orientation is technically
       implementation-defined — show both Y and Z axes' world Y
       component so we can see which one is the actual normal axis on
       this device. */
    const hit = results[0];
    const pose = hit.getPose(xrRefSpace);
    if (!pose) {
        reticle.visible = false;
        lastHit = null;
        setTrackingState('poor');
        debugPill.textContent = 'hits: ' + results.length + '\nno pose';
        return;
    }

    _quat.set(
        pose.transform.orientation.x,
        pose.transform.orientation.y,
        pose.transform.orientation.z,
        pose.transform.orientation.w
    );
    _axisY.set(0, 1, 0).applyQuaternion(_quat);
    _axisZ.set(0, 0, 1).applyQuaternion(_quat);

    /* Per WebXR hit-test convention, local Y is the surface normal.
       For walls that normal is mostly horizontal, so its world Y
       component should stay near zero. */
    const normalWorld = _axisY;
    const isWall = Math.abs(normalWorld.y) < 0.5;

    debugPill.textContent =
        'hits: ' + results.length + '\n' +
        'elapsed: ' + elapsedS + 's\n' +
        'axisY.y: ' + _axisY.y.toFixed(2) + '\n' +
        'axisZ.y: ' + _axisZ.y.toFixed(2) + '\n' +
        'normal: Y\n' +
        'wall: ' + (isWall ? 'yes' : 'no');

    /* Always show the reticle for any hit, but only allow placement
       when it's on a wall. Reticle uses the raw hit matrix for now
       so it sits flush with whatever surface is detected. */
    _hitMatrix.fromArray(pose.transform.matrix);

    if (isWall) {
        /* Build proper wall placement orientation (print stands upright,
           back to wall, face to viewer). */
        _surfaceNormal.copy(normalWorld);
        buildWallPlacementMatrixFromNormal(_hitMatrix, _surfaceNormal, reticle.matrix);
        lastPlacementMatrix.copy(reticle.matrix);
        lastHit = hit;
        setTrackingState('good');
    } else {
        if (Math.abs(normalWorld.y) > 0.75) {
            detectedFloorY = pose.transform.position.y;
            floorSeenAt = performance.now();
        }
        /* Just visualise the hit so we know detection is working,
           but don't allow placement here. */
        reticle.matrix.copy(_hitMatrix);
        lastHit = null;
        setTrackingState('poor');
        if (!isPlaced) statusText.textContent = 'Aim at a wall, not the floor';
    }
    reticle.visible = true;
}

let lastHit = null;
let lastPlacementMatrix = new THREE.Matrix4();

/* Frozen-at-placement values for stable orientation as the user
   moves around. Position follows the anchor each frame; orientation
   is locked from the placement moment to avoid jitter.
   placementWallRight / Up / Normal define the wall's local basis —
   used by drag/twist gestures to project screen motion onto the
   wall surface. */
let placementOrientation = new THREE.Quaternion();
let placementWallRight   = new THREE.Vector3();
let placementWallUp      = new THREE.Vector3();
let placementWallNormal  = new THREE.Vector3();
let placementAnchorPos   = new THREE.Vector3();

/* ──── Tap-to-place (WebXR 'select' event) ────
   Fires when the user taps the screen in an AR area not covered by
   an overlay element. Taps on chips or close button do NOT fire
   this — they fire normal DOM click events instead. */
async function onSelect() {
    if (isPlaced || (!lastHit && !manualPlacementReady)) return;

    /* Freeze the orientation + wall-up axis from the moment of placement. */
    const tmpPos = new THREE.Vector3();
    const tmpScale = new THREE.Vector3();
    lastPlacementMatrix.decompose(tmpPos, placementOrientation, tmpScale);
    placementAnchorPos.copy(tmpPos);

    /* Re-derive the wall-up axis from the placement matrix's Y column. */
    placementWallRight.setFromMatrixColumn(lastPlacementMatrix, 0).normalize();
    placementWallUp.setFromMatrixColumn(lastPlacementMatrix, 1).normalize();
    placementWallNormal.setFromMatrixColumn(lastPlacementMatrix, 2).normalize();
    alignCenterToHangHeight();

    if (lastHit) {
        try {
            printAnchor = await lastHit.createAnchor();
        } catch (e) {
            printAnchor = null;
        }
    } else {
        printAnchor = null;
    }

    isPlaced = true;
    manualWallMode = false;
    manualPlacementReady = false;
    printModel.visible = true;
    reticle.visible = false;
    frontWallBtn.classList.remove('active');

    overlay.classList.add('placed');
    statusText.textContent = 'Placed · use X/Y/Z/R controls to adjust';

    if (navigator.vibrate) navigator.vibrate(60);
}

/* ──── Post-placement: keep print on the wall every frame ────
   Position comes from the XRAnchor (follows ARCore refinement, so
   the print doesn't drift as the user moves). Orientation is locked
   from placement time for visual stability.
   Hang-height offset is applied along the wall's local up axis (not
   world Y) so it stays parallel to the wall surface even if the wall
   is slightly off-vertical. */
const _anchorPos     = new THREE.Vector3();
const _finalPos      = new THREE.Vector3();
const _anchorMatrix4 = new THREE.Matrix4();
const _localZRot     = new THREE.Quaternion();
const _localZAxis    = new THREE.Vector3(0, 0, 1);
const _tapeBottom    = new THREE.Vector3();
const _tapeTop       = new THREE.Vector3();
const _tapeTickA     = new THREE.Vector3();
const _tapeTickB     = new THREE.Vector3();
const _tapeLabelPos  = new THREE.Vector3();

/* Tape segments are now real PlaneGeometry strips rather than
   THREE.Line — WebGL forces lines to 1 device pixel regardless of
   settings, so we get proper world-space thickness this way.
   Each segment is a 5 mm gold strip on top of a 9 mm dark halo
   strip, giving ~2 mm of dark margin around the gold on every
   side. Reads on bright/sunlit walls without changing brand
   colours. */
const GOLD_STRIP_HALF_WIDTH = 0.0025;  // 5 mm gold strip
const HALO_STRIP_HALF_WIDTH = 0.0045;  // 9 mm halo strip (2 mm dark margin)
const HALO_COLOR            = 0x1a1612;
const HALO_OPACITY          = 0.78;

let tapeLine             = null;
let tapeLineHalo         = null;
let tapeBottomTick       = null;
let tapeBottomTickHalo   = null;
let tapeTopTick          = null;
let tapeTopTickHalo      = null;
let tapeLabelSprite      = null;
let tapeLabelTexture     = null;
let tapeLabelCanvas      = null;
let tapeLabelContext     = null;
let lastTapeLabel        = '';

function hasFreshFloor() {
    return detectedFloorY !== null && (performance.now() - floorSeenAt) < FLOOR_MAX_AGE_MS;
}

/* PlaneGeometry-based tape strip: a flat quad in 3D space with
   thickness controlled by halfWidth. Four vertices (two triangles)
   updated per frame from endpoints + a perpendicular axis. Bypasses
   the WebGL 1-pixel line-width limitation entirely. */
function makeTapeStrip(color, opacity) {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(12), 3));
    geometry.setIndex([0, 1, 2, 0, 2, 3]);
    const material = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity,
        depthTest: false,
        depthWrite: false,
        side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.frustumCulled = false;
    mesh.renderOrder = 100;
    return mesh;
}

/* Position the four vertices of a strip mesh as a quad spanning a→b
   with thickness halfWidth*2 along perpAxis. */
function setTapeStrip(mesh, a, b, perpAxis, halfWidth) {
    const pos = mesh.geometry.attributes.position.array;
    const px = perpAxis.x * halfWidth;
    const py = perpAxis.y * halfWidth;
    const pz = perpAxis.z * halfWidth;

    pos[0]  = a.x - px; pos[1]  = a.y - py; pos[2]  = a.z - pz;
    pos[3]  = a.x + px; pos[4]  = a.y + py; pos[5]  = a.z + pz;
    pos[6]  = b.x + px; pos[7]  = b.y + py; pos[8]  = b.z + pz;
    pos[9]  = b.x - px; pos[10] = b.y - py; pos[11] = b.z - pz;

    mesh.geometry.attributes.position.needsUpdate = true;
}

/* Updates a gold strip + its dark halo strip in one call. halo is
   wider (HALO_STRIP_HALF_WIDTH > GOLD_STRIP_HALF_WIDTH) and sits
   below the gold via renderOrder, so it reads as an outline. */
function setTapeStripWithHalo(gold, halo, a, b, perpAxis) {
    setTapeStrip(halo, a, b, perpAxis, HALO_STRIP_HALF_WIDTH);
    setTapeStrip(gold, a, b, perpAxis, GOLD_STRIP_HALF_WIDTH);
}

function initTapeMeasure() {
    tapeGroup = new THREE.Group();
    tapeGroup.visible = false;
    tapeGroup.renderOrder = 100;

    /* Halos first — wider dark strips, added to the group before
       the gold strips and at renderOrder 99 so they reliably render
       behind. */
    tapeLineHalo       = makeTapeStrip(HALO_COLOR, HALO_OPACITY); tapeLineHalo.renderOrder = 99;
    tapeBottomTickHalo = makeTapeStrip(HALO_COLOR, HALO_OPACITY); tapeBottomTickHalo.renderOrder = 99;
    tapeTopTickHalo    = makeTapeStrip(HALO_COLOR, HALO_OPACITY); tapeTopTickHalo.renderOrder = 99;
    tapeGroup.add(tapeLineHalo, tapeBottomTickHalo, tapeTopTickHalo);

    /* Gold strips on top */
    tapeLine       = makeTapeStrip(0xCFA246, 0.95);
    tapeBottomTick = makeTapeStrip(0xf7f3ec, 0.85);
    tapeTopTick    = makeTapeStrip(0xf7f3ec, 0.85);
    tapeGroup.add(tapeLine, tapeBottomTick, tapeTopTick);

    tapeLabelCanvas = document.createElement('canvas');
    tapeLabelCanvas.width = 512;
    tapeLabelCanvas.height = 160;
    tapeLabelContext = tapeLabelCanvas.getContext('2d');
    tapeLabelTexture = new THREE.CanvasTexture(tapeLabelCanvas);
    tapeLabelTexture.colorSpace = THREE.SRGBColorSpace;
    tapeLabelSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: tapeLabelTexture,
        transparent: true,
        depthTest: false,
        depthWrite: false
    }));
    tapeLabelSprite.renderOrder = 101;
    tapeLabelSprite.scale.set(0.52, 0.16, 1);
    tapeGroup.add(tapeLabelSprite);

    scene.add(tapeGroup);
}

function formatTapeLabel(heightM, isMeasured) {
    const inches = Math.round(heightM / 0.0254);
    const cm = Math.round(heightM * 100);
    return (isMeasured ? '' : '~') + inches + '" / ' + cm + ' cm to centre';
}

function drawTapeLabel(text) {
    if (text === lastTapeLabel) return;
    lastTapeLabel = text;

    const ctx = tapeLabelContext;
    ctx.clearRect(0, 0, tapeLabelCanvas.width, tapeLabelCanvas.height);
    ctx.fillStyle = 'rgba(10,10,10,0.78)';
    ctx.fillRect(0, 20, tapeLabelCanvas.width, 104);
    ctx.strokeStyle = 'rgba(207,162,70,0.82)';
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 22, tapeLabelCanvas.width - 4, 100);
    ctx.fillStyle = '#CFA246';
    ctx.font = '700 34px Inter, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, tapeLabelCanvas.width / 2, 74);
    tapeLabelTexture.needsUpdate = true;
}

function alignCenterToHangHeight() {
    if (!hasFreshFloor() || Math.abs(placementWallUp.y) < 0.2) return false;

    const desiredY = detectedFloorY + hangHeightIn * 0.0254;
    const currentY = placementAnchorPos.y
        + placementWallRight.y * wallOffsetX
        + placementWallUp.y * wallOffsetY
        + placementWallNormal.y * wallOffsetZ;
    wallOffsetY += (desiredY - currentY) / placementWallUp.y;
    return true;
}

function updateTapeMeasure() {
    if (!tapeGroup || !isPlaced) return;

    /* Tape only makes architectural sense on a near-vertical wall —
       the rule is meant to drop straight down to the floor. Bail if
       the placement's wall-up axis isn't reasonably aligned with
       world-up (same threshold as alignCenterToHangHeight). Hides
       the tape group entirely so a leftover from a previous
       placement can't linger at a weird angle. */
    if (Math.abs(placementWallUp.y) < 0.2) {
        tapeGroup.visible = false;
        return;
    }

    const measured = hasFreshFloor();
    const heightM = measured
        ? Math.max(0, _finalPos.y - detectedFloorY)
        : hangHeightIn * 0.0254;
    const floorY = measured ? detectedFloorY : _finalPos.y - heightM;
    const normalLift = 0.018 + Math.max(0, wallOffsetZ);
    const tickHalf = 0.09;

    _tapeBottom.copy(_finalPos);
    _tapeBottom.y = floorY;
    _tapeBottom.addScaledVector(placementWallNormal, normalLift);

    _tapeTop.copy(_finalPos).addScaledVector(placementWallNormal, normalLift);

    /* Vertical rule — strip width extends along placementWallRight */
    setTapeStripWithHalo(tapeLine, tapeLineHalo,
        _tapeBottom, _tapeTop, placementWallRight);

    _tapeTickA.copy(_tapeBottom).addScaledVector(placementWallRight, -tickHalf);
    _tapeTickB.copy(_tapeBottom).addScaledVector(placementWallRight, tickHalf);
    /* Horizontal tick — strip width extends along placementWallUp */
    setTapeStripWithHalo(tapeBottomTick, tapeBottomTickHalo,
        _tapeTickA, _tapeTickB, placementWallUp);

    _tapeTickA.copy(_tapeTop).addScaledVector(placementWallRight, -tickHalf);
    _tapeTickB.copy(_tapeTop).addScaledVector(placementWallRight, tickHalf);
    setTapeStripWithHalo(tapeTopTick, tapeTopTickHalo,
        _tapeTickA, _tapeTickB, placementWallUp);

    drawTapeLabel(formatTapeLabel(heightM, measured));
    _tapeLabelPos.copy(_tapeBottom).lerp(_tapeTop, 0.5)
        .addScaledVector(placementWallRight, 0.32)
        .addScaledVector(placementWallNormal, 0.02);
    tapeLabelSprite.position.copy(_tapeLabelPos);
    tapeGroup.visible = true;
}

function updatePrintFromAnchor(frame) {
    if (printAnchor) {
        const pose = frame.getPose(printAnchor.anchorSpace, xrRefSpace);
        if (pose) {
            _anchorMatrix4.fromArray(pose.transform.matrix);
            _anchorPos.setFromMatrixPosition(_anchorMatrix4);
        } else {
            _anchorPos.copy(placementAnchorPos);
        }
    } else {
        _anchorPos.copy(placementAnchorPos);
    }

    _finalPos.copy(_anchorPos)
        .addScaledVector(placementWallRight, wallOffsetX)
        .addScaledVector(placementWallUp, wallOffsetY)
        .addScaledVector(placementWallNormal, wallOffsetZ);

    printModel.position.copy(_finalPos);
    printModel.quaternion
        .copy(placementOrientation)
        .multiply(_localZRot.setFromAxisAngle(_localZAxis, wallRotZ));
    printModel.scale.set(1, 1, 1);
    printModel.updateMatrix();

    updateTapeMeasure();
}

/* ──── Tracking state → overlay class toggle ──── */
function setTrackingState(state) {
    if (state === 'good') {
        overlay.classList.add('tracking-good');
        overlay.classList.remove('tracking-poor');
        if (!isPlaced) statusText.textContent = 'Wall found · tap the gold ring to place';
    } else {
        overlay.classList.remove('tracking-good');
        overlay.classList.add('tracking-poor');
        if (!isPlaced) statusText.textContent = 'Slowly point your camera at a wall';
    }
}

/* Fine adjustment controls. */
function resetWallOffsets() {
    wallOffsetX = 0;
    wallOffsetZ = 0;
    wallRotZ = 0;
    wallOffsetY = (hangHeightIn - DEFAULT_HANG_HEIGHT_IN) * 0.0254;
    if (isPlaced) alignCenterToHangHeight();
}

function adjustPrint(action) {
    switch (action) {
        case 'x-': wallOffsetX -= MOVE_STEP_M; break;
        case 'x+': wallOffsetX += MOVE_STEP_M; break;
        case 'y-': wallOffsetY -= MOVE_STEP_M; break;
        case 'y+': wallOffsetY += MOVE_STEP_M; break;
        case 'z-': wallOffsetZ -= MOVE_STEP_M; break;
        case 'z+': wallOffsetZ += MOVE_STEP_M; break;
        case 'rot-': wallRotZ -= ROT_STEP_RAD; break;
        case 'rot+': wallRotZ += ROT_STEP_RAD; break;
        case 'reset': resetWallOffsets(); break;
    }
}

function stopAdjustRepeat() {
    if (adjustRepeatTimer) {
        clearInterval(adjustRepeatTimer);
        adjustRepeatTimer = null;
    }
}

function wireAdjustControls() {
    if (adjustControlsWired) return;
    adjustControlsWired = true;

    document.querySelectorAll('#movePanel .adjust-btn').forEach((button) => {
        const action = button.getAttribute('data-adjust');
        button.addEventListener('click', (e) => e.stopPropagation());
        button.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!isPlaced) return;
            adjustPrint(action);
            stopAdjustRepeat();
            if (action !== 'reset') {
                adjustRepeatTimer = setInterval(() => adjustPrint(action), 90);
            }
        });
        button.addEventListener('pointerup', stopAdjustRepeat);
        button.addEventListener('pointercancel', stopAdjustRepeat);
        button.addEventListener('pointerleave', stopAdjustRepeat);
    });
}

function wireFrontWallButton() {
    if (frontWallButtonWired) return;
    frontWallButtonWired = true;

    frontWallBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (isPlaced) return;

        manualWallMode = !manualWallMode;
        manualPlacementReady = false;
        lastHit = null;
        frontWallBtn.classList.toggle('active', manualWallMode);
        frontWallBtn.textContent = manualWallMode ? 'Scanning front' : 'Use front wall';

        if (!manualWallMode) {
            reticle.visible = false;
            setTrackingState('poor');
        }
    });
}

/* ──── Hang-height chips ────
   Updates state pre- and post-placement.
   - Pre-placement: changes the future hang height
   - Post-placement: slides the print up or down the wall in real time
     by adjusting wallOffsetY. The next frame's updatePrintFromAnchor
     will apply the new offset. */
function wireChips() {
    if (hangChipsWired) return;
    hangChipsWired = true;

    const chips = document.querySelectorAll('#chipRow .chip');
    chips.forEach((chip) => {
        chip.addEventListener('click', (e) => {
            e.stopPropagation();
            chips.forEach((c) => c.classList.remove('active'));
            chip.classList.add('active');

            const newH = parseInt(chip.getAttribute('data-h'), 10);

            // Convert chip delta to a wall-local vertical offset (inches → metres)
            const previousH = hangHeightIn;
            const deltaIn = newH - previousH;
            hangHeightIn = newH;
            if (isPlaced && hasFreshFloor() && Math.abs(placementWallUp.y) >= 0.2) {
                const desiredY = detectedFloorY + newH * 0.0254;
                wallOffsetY += (desiredY - _finalPos.y) / placementWallUp.y;
            } else {
                wallOffsetY += deltaIn * 0.0254;
            }
        });
    });
}

/* Size chips — swap the GLB live, both before and after placement.
   Pre-placement: just updates currentSize + HUD; the next reticle
   tap will place the newly-selected size.
   Post-placement: loads (or pulls from cache) the new GLB, removes
   the current model from the scene, attaches the new one to the
   anchor with the SAME placement orientation + hang offset — visual
   continuity, no need to re-tap. */
async function wireSizeChips() {
    if (sizeChipsWired) return;
    sizeChipsWired = true;

    const chips = document.querySelectorAll('#sizeRow .chip');
    for (const chip of chips) {
        chip.addEventListener('click', async (e) => {
            e.stopPropagation();
            const sizeId = chip.getAttribute('data-size');
            const newSize = SIZES.find((s) => s.id === sizeId);
            if (!newSize || newSize === currentSize) return;

            /* Visual feedback while loading */
            chips.forEach((c) => { c.setAttribute('disabled', ''); c.classList.remove('active'); });
            chip.classList.add('active');

            try {
                const newModel = await loadSizedGLB(newSize);

                /* Swap into the scene */
                if (printModel && scene) scene.remove(printModel);
                printModel = newModel;
                if (scene) scene.add(printModel);

                /* If we're post-placement, restore the placement transform
                   so the new size appears at the same anchor + same hang
                   height without the user re-tapping. */
                if (isPlaced) {
                    printModel.visible = true;
                    printModel.matrixAutoUpdate = false;
                    /* Position + orientation are reapplied each frame by
                       updatePrintFromAnchor — nothing else needed here. */
                } else {
                    printModel.visible = false;
                }

                currentSize = newSize;
                refreshHud();
            } catch (err) {
                /* Load failed — revert UI */
                console.error('[AR-XR] size swap failed', err);
                chip.classList.remove('active');
                const prev = document.querySelector(
                    '#sizeRow .chip[data-size="' + currentSize.id + '"]'
                );
                if (prev) prev.classList.add('active');
            } finally {
                chips.forEach((c) => c.removeAttribute('disabled'));
            }
        });
    }
}

/* ──── Session end / cleanup ──── */
function onSessionEnd() {
    if (hitTestSource) { hitTestSource.cancel(); hitTestSource = null; }
    xrRefSpace = null;
    viewerSpace = null;
    printAnchor = null;
    isPlaced = false;
    detectedFloorY = null;
    floorSeenAt = 0;
    manualWallMode = false;
    manualPlacementReady = false;
    wallOffsetX = 0;
    wallOffsetY = (hangHeightIn - DEFAULT_HANG_HEIGHT_IN) * 0.0254;
    wallOffsetZ = 0;
    wallRotZ = 0;
    stopAdjustRepeat();
    firstFrameRendered = false;
    /* Drop all detected-plane wireframes — fresh start on next entry */
    for (const [, wireframe] of planeWireframes) {
        if (scene) scene.remove(wireframe);
        wireframe.geometry.dispose();
        wireframe.material.dispose();
    }
    planeWireframes.clear();
    if (tapeGroup) tapeGroup.visible = false;
    lastTapeLabel = '';
    overlay.classList.remove('active', 'tracking-good', 'tracking-poor', 'placed');
    frontWallBtn.classList.remove('active');
    frontWallBtn.textContent = 'Use front wall';
    document.body.classList.remove('xr-active');
    loadingPill.classList.remove('show');
    if (renderer) {
        renderer.setAnimationLoop(null);
        renderer.domElement.remove();
        renderer = null;
    }
    launchScreen.style.display = 'flex';
}

/* ──── Resize handling (rare in WebXR but safe to have) ──── */
window.addEventListener('resize', () => {
    if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ──── Go ──── */
init();
</script>

</body>
